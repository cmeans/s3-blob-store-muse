name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for every job: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NOTE: pr-labels.yml and pr-labels-ci.yml find this workflow by its name
  # ("CI") and file (ci.yml). If either is renamed, update them too.
  #
  # What CI can't do: install the project's dependencies, typecheck or
  # build. The Muse Space SDK (@hatch/space-sdk in package.json) is a local
  # file dependency that exists only inside a Muse Space, so `bun install`,
  # `bun run typecheck` and `bun run build` run there. These checks need
  # nothing from it: the behavior tests install just the packages they use
  # and replace the SDK with a stub (server/test/sdk-stub.ts).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          node --version
          python3 --version
          jq --version
      # The checks below are independent: each runs even when an earlier one
      # failed, so one CI run reports every problem.
      - name: Nothing ignored is committed
        # The Space's database, build output, dependencies and install cache
        # are .gitignore'd; this catches one added with `git add -f`.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          bad=$(git ls-files -ci --exclude-standard)
          if [ -n "$bad" ]; then
            echo "tracked files that .gitignore excludes: $bad"
            exit 1
          fi
      - name: Manifests parse
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          for f in space.json package.json; do
            jq -e 'type == "object"' "$f" > /dev/null \
              || { echo "::error file=$f::$f is missing or not a JSON object"; exit 1; }
          done
          # Each key is a non-empty string (jq treats "" as true).
          jq -e '[.runtime, .entry, .slug] | all(type == "string" and length > 0)' space.json > /dev/null \
            || { echo "::error file=space.json::runtime, entry and slug must be non-empty strings"; exit 1; }
          jq -e '.devDependencies.typescript | type == "string" and length > 0' package.json > /dev/null \
            || { echo "::error file=package.json::devDependencies.typescript must be a non-empty string"; exit 1; }
      - name: bun.lock matches package.json
        # Can't install (the Space SDK is a file: tarball inside Muse), so
        # this checks the lockfile's structure against package.json instead.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 .github/scripts/check-bun-lock.py bun.lock package.json
      - name: TypeScript and JavaScript sources parse
        # The TypeScript version package.json pins, installed on its own.
        # Parser errors only: errors TypeScript reports from its checker
        # (`break` outside a loop, `export const x;`) need the typecheck.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          TS_VERSION=$(jq -r '.devDependencies.typescript' package.json)
          npm install --prefix "$RUNNER_TEMP/ts" --no-save --ignore-scripts --no-audit --no-fund "typescript@$TS_VERSION"
          git ls-files -z -- '*.ts' '*.tsx' '*.mts' '*.cts' '*.js' '*.jsx' '*.mjs' '*.cjs' ':!:.github/**' \
            | NODE_PATH="$RUNNER_TEMP/ts/node_modules" xargs -0 -r node .github/scripts/check-ts-syntax.mjs
      - name: Relative Markdown links resolve
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          git ls-files -z -- '*.md' | xargs -0 -r python3 .github/scripts/check-md-links.py
      - name: Messages the docs quote are in the code
        # Each quoted console message (inline code that starts with a capital
        # letter, contains a space and ends with a period) must match a
        # string in server/src or client/src. Uses the pinned TypeScript, as
        # the parse step above does; installing it again is a no-op when that
        # step already did, and keeps this step independent of it.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          TS_VERSION=$(jq -r '.devDependencies.typescript' package.json)
          npm install --prefix "$RUNNER_TEMP/ts" --no-save --ignore-scripts --no-audit --no-fund "typescript@$TS_VERSION"
          mapfile -d '' docs < <(git ls-files -z -- '*.md')
          mapfile -d '' src < <(git ls-files -z -- 'server/src/*' 'client/src/*' \
            | grep -zE '\.([cm]?[jt]sx?)$')
          NODE_PATH="$RUNNER_TEMP/ts/node_modules" node .github/scripts/check-doc-quotes.mjs \
            --docs "${docs[@]}" --src "${src[@]}"
      - name: Drizzle journal matches the migrations
        # drizzle/meta/_journal.json lists every drizzle/*.sql, once, with
        # idx 0..n-1 and each `when` later than the one before (from the
        # third entry on; the first two share one, from the live Space): the
        # migrator skips a file the journal doesn't list, or an entry that
        # isn't later, without a word. It can't tell an edited migration
        # from the original.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash .github/scripts/check-drizzle-journal.sh drizzle
      - name: Server tests pass
        # server/test, under bun test:
        # - actions.test.ts: each action in server/src/actions.ts against a
        #   local fake of the store (server/test/fake-store.ts), with a real
        #   drizzle on bun:sqlite set up by the drizzle/ migrations, and the
        #   Space SDK replaced by server/test/sdk-stub.ts;
        # - schema-migrations.test.ts: the tables the drizzle/ migrations
        #   build match server/src/schema.ts (columns, types and
        #   constraints; views by name).
        # Installs only what the tests use, at the versions package.json
        # pins: bun (its packageManager), zod and drizzle-orm.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          BUN_VERSION=$(jq -r '.packageManager | ltrimstr("bun@")' package.json)
          ZOD_VERSION=$(jq -r '.dependencies.zod' package.json)
          DRIZZLE_VERSION=$(jq -r '.dependencies["drizzle-orm"]' package.json)
          DEPS="$RUNNER_TEMP/test-deps"
          npm install --prefix "$DEPS" --no-save --ignore-scripts --no-audit --no-fund \
            "bun@$BUN_VERSION" "zod@$ZOD_VERSION" "drizzle-orm@$DRIZZLE_VERSION"
          # With --ignore-scripts, bun's npm package doesn't link its binary
          # (its postinstall does that); the platform package holds it.
          case "$(uname -m)" in
            x86_64) ARCH=x64 ;;
            aarch64) ARCH=aarch64 ;;
            *) echo "::error::no bun build for $(uname -m)"; exit 1 ;;
          esac
          BUN="$DEPS/node_modules/@oven/bun-linux-$ARCH/bin/bun"
          # actions.ts imports zod and drizzle-orm by name, so they go in the
          # repo's node_modules (gitignored), where bun resolves them.
          mkdir -p node_modules
          cp -R "$DEPS/node_modules/zod" "$DEPS/node_modules/drizzle-orm" node_modules/
          "$BUN" --version
          "$BUN" test server/test
      - name: Workflows pass actionlint
        # actionlint's own image, pinned by digest (the multi-arch index for
        # tag 1.7.12). It bundles ShellCheck 0.11.0, so run: scripts are
        # checked by a fixed ShellCheck, not whichever one the runner image
        # has. Docker pulls the image; the container itself gets no network
        # and a read-only checkout. To upgrade: take the new tag's index
        # digest (`skopeo inspect --raw docker://docker.io/rhysd/actionlint:<tag>
        # | sha256sum`) and run it on these workflows first.
        # Each problem prints as an ::error annotation on its file and line
        # (GitHub shows up to 10 per step; the log has them all). The
        # template escapes what workflow commands treat as special: % in
        # the message, and % , : in the file name.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          IMAGE: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: |
          docker pull -q "$IMAGE" \
            || { echo "::error::Couldn't pull the actionlint image (Docker Hub down or rate-limited?). This isn't a lint failure: re-run the job, and if it fails again, check the IMAGE digest in ci.yml's 'Workflows pass actionlint' step."; exit 1; }
          docker run --rm --network=none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$IMAGE" \
            -format '{{range $err := .}}::error file={{replace $err.Filepath "%" "%25" "," "%2C" ":" "%3A"}},line={{$err.Line}},col={{$err.Column}}::{{replace $err.Message "%" "%25"}} [{{$err.Kind}}]\n{{end}}'
